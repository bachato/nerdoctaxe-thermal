name: Build NerdOCTAXE-Gamma AUTO v3 Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/build-nerdoctaxe-thermal.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_COMMIT: b4af4e84aa3cb5ab066c9fea77dbc77beb9abcb3
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Fetch pinned upstream firmware
        run: |
          git init upstream
          cd upstream
          git remote add origin https://github.com/shufps/ESP-Miner-NerdQAxePlus.git
          git fetch --depth 1 origin "${UPSTREAM_COMMIT}"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive

      - name: Apply AUTO v3 governor and AxeOS controls
        run: |
          cp scripts/apply_thermal_governor.py upstream/apply_thermal_governor.py
          cp scripts/fix_auto_v3_failsafe.py upstream/fix_auto_v3_failsafe.py
          cd upstream
          python3 apply_thermal_governor.py
          python3 fix_auto_v3_failsafe.py

      - name: Prepare AxeOS version assets
        working-directory: upstream
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_TAG="auto3-${COMMIT_HASH}"
          sed -e "s|__COMMIT__|${COMMIT_HASH}|g" -i ./main/http_server/axe-os/src/app/app.module.ts
          sed -e "s|__VERSION__|${VERSION_TAG}|g" -i ./main/http_server/axe-os/src/app/app.module.ts
          for l in de en es fr it pl ro da zh-CN; do
            mv "./main/http_server/axe-os/src/assets/i18n/${l}.json" "./main/http_server/axe-os/src/assets/i18n/${l}.${COMMIT_HASH}.json"
          done
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV

      - name: Set ESP32-S3 target
        working-directory: upstream
        run: |
          docker run --rm --user root -e BOARD=NERDOCTAXEGAMMA -v $PWD:/home/builder/project \
            shufps/esp-idf-builder:0.0.1 idf.py set-target esp32s3

      - name: Build firmware
        working-directory: upstream
        run: |
          docker run --rm --user root -e BOARD=NERDOCTAXEGAMMA -v $PWD:/home/builder/project \
            shufps/esp-idf-builder:0.0.1 idf.py build

      - name: Prepare OTA and factory images
        working-directory: upstream
        run: |
          cp build/esp-miner.bin esp-miner-NerdOCTAXE-Gamma.bin
          cp build/www.bin www.bin
          docker run --rm --user root -v $PWD:/home/builder/project \
            shufps/esp-idf-builder:0.0.1 esptool.py --chip esp32s3 merge_bin --flash_mode dio --flash_size 16MB --flash_freq 80m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/esp-miner.bin \
            0x410000 build/www.bin \
            0xf10000 build/ota_data_initial.bin \
            -o nerdOCTAXE-Gamma-auto-v3-factory.bin

      - name: Upload OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: nerdOCTAXE-Gamma-auto-v3-ota
          path: upstream/esp-miner-NerdOCTAXE-Gamma.bin
          retention-days: 14

      - name: Upload matching AxeOS WWW image
        uses: actions/upload-artifact@v4
        with:
          name: nerdOCTAXE-Gamma-auto-v3-www
          path: upstream/www.bin
          retention-days: 14

      - name: Upload factory firmware
        uses: actions/upload-artifact@v4
        with:
          name: nerdOCTAXE-Gamma-auto-v3-factory
          path: upstream/nerdOCTAXE-Gamma-auto-v3-factory.bin
          retention-days: 14
