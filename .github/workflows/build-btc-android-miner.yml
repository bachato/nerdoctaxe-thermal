name: Build BTC Android Miner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BTC Android Miner
        uses: actions/checkout@v4
        with:
          repository: VirtusVerbis/BTC_Anrdoid_Miner
          path: miner

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and shader tools
        run: |
          yes | sdkmanager "ndk;25.1.8937393" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Build debug APK
        working-directory: miner
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btc-android-miner-debug
          path: miner/app/build/outputs/apk/debug/app-debug.apk
